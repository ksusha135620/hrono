<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{
  --bg:#f4eee1; --card:#fffcf5; --ink:#28231a; --muted:#8a8172;
  --line:#e6dcc6; --navy:#1e3a5f; --navy-d:#152a44;
  --gold:#c9a227; --gold-l:#e9d18a; --red:#a33a2e; --green:#3e7a4f;
  --radius:16px; --shadow:0 6px 20px rgba(40,35,26,.09);
}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:
  radial-gradient(1200px 400px at 50% -100px, #fdf8ec 0%, var(--bg) 70%);
  color:var(--ink);min-height:100vh}
h1,h2,h3,.serif{font-family:Georgia,'Times New Roman',serif}
button{font-family:inherit}
/* ---------- шапка ---------- */
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--navy),var(--navy-d));
  color:#f3ead3;padding:10px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 12px rgba(21,42,68,.35)}
.logo{display:flex;align-items:center;gap:10px}
.logo .t{font-family:Georgia,serif;font-size:20px;letter-spacing:.4px}
.logo .t small{display:block;font-size:11px;color:var(--gold-l);letter-spacing:1.6px;text-transform:uppercase}
nav{margin-left:auto;display:flex;gap:8px}
.nav-btn{background:transparent;border:1px solid rgba(243,234,211,.35);color:#f3ead3;padding:8px 14px;
  border-radius:10px;cursor:pointer;font-size:14px;transition:.15s}
.nav-btn:hover{background:rgba(243,234,211,.12)}
.nav-btn.active{background:var(--gold);border-color:var(--gold);color:#241c07;font-weight:600}
/* ---------- ученик и синхронизация ---------- */
.user-box{display:flex;align-items:center;gap:10px;font-size:13.5px;margin-left:6px}
.user-name{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync-st{font-size:12px;color:var(--gold-l);white-space:nowrap}
.sync-st.bad{color:#ffb9ad}
.sync-st.dark{color:var(--muted)}
.sync-st.dark.bad{color:var(--red)}
.nav-btn.tiny-btn{padding:6px 11px;font-size:12.5px}
.logged-out nav{display:none}
.login-card{max-width:540px;margin:36px auto;text-align:center;padding:30px 26px}
.login-card h1{font-size:27px;margin-bottom:10px}
.login-card p{line-height:1.5;margin-bottom:18px}
.login-row{margin-bottom:10px}
.login-row .type-input{text-transform:uppercase;font-size:19px;min-width:0}
.login-row .type-input::placeholder{text-transform:none;font-size:16px}
.login-msg{min-height:20px;color:var(--red);line-height:1.45}
.btn:disabled{opacity:.6;cursor:default;transform:none}
section.card > h3{margin-bottom:8px}
.lead{margin-bottom:10px;line-height:1.45}
.filter-row select{max-width:100%}
/* ---------- общий каркас ---------- */
main{max-width:1080px;margin:0 auto;padding:22px 18px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px} .nowrap{white-space:nowrap}
.center{text-align:center} .gap{height:10px}
.sect-title{margin:26px 4px 12px;font-size:22px}
.note{border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:14px;line-height:1.5}
.note.warn{background:#fdf3d7;border:1px solid #e8d49a;color:#6b5410}
/* ---------- кнопки ---------- */
.btn{background:var(--navy);color:#fff;border:none;border-radius:11px;padding:10px 18px;font-size:14.5px;
  cursor:pointer;transition:.15s;border:1px solid var(--navy)}
.btn:hover{background:#27496f;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
.btn.ghost:hover{background:#f3ecdc}
.btn.tiny{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.green{background:var(--green);border-color:var(--green)}
.btn.green:hover{background:#4b8f5e}
.btn.red{background:#fdecea;color:var(--red);border-color:#eccfcb}
.btn.red:hover{background:#f9dbd7}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#241c07;font-weight:600}
/* ---------- чипы ---------- */
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600}
.chip-done{background:#e2efe5;color:#2c5e3b}
.chip-learn{background:#fdf0cd;color:#7c5e11}
.chip-new{background:#eee8db;color:#7a7263}
/* ---------- главная: hero ---------- */
.hero{display:flex;gap:24px;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,#fffdf6 60%,#f7edd3);padding:26px 28px}
.hero-left{flex:1}
.hero-kicker{font-size:12.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px}
.hero h1{font-size:30px;line-height:1.15;margin-bottom:12px}
.hero-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.hero-ring{text-align:center;flex-shrink:0}
.mode-row{display:flex;gap:8px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:8px;margin-top:12px;cursor:pointer;font-size:14px;color:#5c5340}
.toggle input{width:17px;height:17px;accent-color:var(--navy)}
/* ---------- сетка периодов ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.period .period-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.period h3{font-size:17px;line-height:1.25}
.p-ic{font-size:24px;line-height:1;margin-top:2px}
.p-count{margin-left:auto;white-space:nowrap;padding-top:3px}
.bar{height:8px;background:#ece4d2;border-radius:99px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#a8841a);border-radius:99px;transition:width .4s}
.foot-note{margin:22px 4px;line-height:1.5}
/* ---------- сессия ---------- */
.session-top{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.prog-line{flex:1;height:8px;background:#ece4d2;border-radius:99px;overflow:hidden}
.prog-line i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),#3d6ea8);border-radius:99px;transition:width .3s}
.crumb{margin:2px 2px 14px}
/* карточки */
.flip-wrap{perspective:1400px;max-width:660px;margin:8px auto 16px;cursor:pointer}
.flip-card{position:relative;width:100%;height:330px;transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.2,.7,.3,1)}
.flip-card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;overflow:auto}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,#22385a,#152a44);color:#f3ead3;border-color:#0f2036}
.face-label{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:14px}
.e-title{font-size:27px;line-height:1.3;max-width:520px}
.face-hint{margin-top:22px;color:var(--muted);font-size:13px}
.e-year{font-family:Georgia,serif;font-size:44px;color:var(--gold-l);margin-bottom:10px;line-height:1.1}
.e-title2{font-size:18px;margin-bottom:12px;opacity:.95}
.e-desc{font-size:14.5px;line-height:1.55;opacity:.85;max-width:520px}
.rate-row{display:flex;gap:12px;justify-content:center;max-width:660px;margin:0 auto 10px}
.rate-row .btn{min-width:170px}
.hint{text-align:center;margin-bottom:8px}
/* вопрос */
.q-box{max-width:660px;margin:6px auto 18px;text-align:center}
.q-label{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.q-year{font-size:42px;color:var(--navy)}
.q-title{font-size:26px;line-height:1.3;margin-bottom:6px}
.opts{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1.5px solid var(--line);
  border-radius:12px;padding:13px 16px;font-size:15.5px;cursor:pointer;transition:.13s;color:var(--ink)}
.opt:hover{border-color:var(--gold);background:#fff9e8}
.opt-letter{flex-shrink:0;width:28px;height:28px;border-radius:8px;background:#efe7d4;color:#6b5e3d;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px}
.opt.correct{border-color:var(--green);background:#e9f4ec}
.opt.correct .opt-letter{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:#fdefed}
.opt.wrong .opt-letter{background:var(--red);color:#fff}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
.fb{max-width:660px;margin:16px auto 10px;border-radius:12px;padding:13px 17px;font-size:14.5px;line-height:1.5}
.fb.ok{background:#e9f4ec;border:1px solid #bcdcc5}
.fb.bad{background:#fdefed;border:1px solid #eec7c1}
.fb-desc{margin-top:7px;color:#4d4636}
/* ввод года */
.type-row{max-width:660px;margin:0 auto 10px;display:flex;gap:10px}
.type-input{flex:1;font-size:22px;padding:10px 16px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--card);color:var(--ink);font-family:Georgia,serif;text-align:center}
.type-input:focus{outline:none;border-color:var(--gold)}
/* завершение */
.done-box{max-width:660px;margin:20px auto}
.done-flex{display:flex;gap:20px;align-items:center;margin:14px 0}
.done-line{font-size:17px}
.mini-title{margin:16px 0 8px;font-size:16px}
.miss-list{list-style:none}
.miss-list li{padding:9px 0;border-bottom:1px dashed var(--line);line-height:1.45}
/* ---------- прогресс ---------- */
.stat-lines{line-height:2;font-size:15px}
.code{width:100%;font-size:11px;font-family:Consolas,monospace;border:1px solid var(--line);border-radius:10px;
  padding:8px;resize:vertical;background:#faf6ea;color:#4d4636;margin:8px 0}
.filter-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filter-row select{padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);
  font-size:14px;color:var(--ink);font-family:inherit}
.table-wrap{overflow-x:auto;max-height:70vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px}
table.dates{width:100%;border-collapse:collapse;font-size:14px}
table.dates td{padding:9px 12px;border-bottom:1px solid #f0e9d8;vertical-align:top}
table.dates tr.group td{background:#f5efdf;font-size:13.5px;padding:7px 12px}
table.dates .yr{white-space:nowrap;width:110px}
table.dates .st{width:110px;text-align:right}
.danger-zone h3{color:var(--red);margin-bottom:10px}
/* ---------- модальное окно ---------- */
.modal-back{position:fixed;inset:0;background:rgba(30,25,15,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border-radius:18px;padding:26px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
.modal h3{margin-bottom:10px}
.modal p{color:#5c5340;font-size:14.5px;margin-bottom:18px;line-height:1.5}
.modal .mode-row{justify-content:center}
/* ---------- тост ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--navy-d);
  color:#f3ead3;padding:11px 22px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- адаптив ---------- */
@media (max-width:680px){
  main{padding:14px 12px 60px}
  .hero{flex-direction:column-reverse;align-items:flex-start;padding:20px}
  .hero h1{font-size:24px}
  header{flex-wrap:wrap}
  nav{margin-left:0;width:100%;order:3}
  header{padding:10px 14px;gap:10px}
  .user-box{order:2;margin-left:auto;gap:8px}
  .user-box .user-name{display:none}
  .logged-in .logo .t small{display:none}
  .logged-in .logo svg{width:24px;height:24px}
  .stat-lines{line-height:1.65;font-size:14.5px}
  .login-card{margin:16px auto;padding:24px 18px}
  .login-card h1{font-size:23px}
  .flip-card{height:400px}
  .rate-row{flex-direction:column}
  .rate-row .btn{width:100%}
  .type-row{flex-direction:column}
  .e-title{font-size:22px}
  .e-year{font-size:36px}
  .logo .t{font-size:17px}
}
</style>

<script>
/* ============================================================
   Хронотренажёр — база ключевых дат истории России
   Даты до 14 февраля 1918 года — по старому стилю.
   Формат записи: [раздел, год, уточнение месяца, событие, описание]
   ============================================================ */

const PERIODS = {
  rus:   { name: 'Древняя Русь',                        years: '862–1237',    icon: '🛡' },
  ord:   { name: 'Ордынское время и возвышение Москвы', years: '1240–1497',   icon: '🐎' },
  mos:   { name: 'Московское царство',                  years: '1505–1598',   icon: '👑' },
  smuta: { name: 'Смутное время',                       years: '1598–1618',   icon: '🕯' },
  rom:   { name: 'Первые Романовы (XVII век)',          years: '1632–1689',   icon: '⚔' },
  imp18: { name: 'Российская империя: XVIII век',       years: '1695–1799',   icon: '⚓' },
  imp19: { name: 'Российская империя: XIX век',         years: '1801–1894',   icon: '🚂' },
  xx:    { name: 'XX век',                              years: '1898–1991',   icon: '✈' },
  rf:    { name: 'Новейшее время',                      years: '1992–2000-е', icon: '🌐' }
};

const RAW = [

/* ---------- ДРЕВНЯЯ РУСЬ ---------- */
['rus','862','','Призвание варягов','По «Повести временных лет» новгородцы призвали на княжение варяга Рюрика; условное начало государства и династии.'],
['rus','882','','Объединение Новгорода и Киева','Вещий Олег объединил северные и южные центры восточных славян; условная дата образования Древнерусского государства.'],
['rus','911','','Договор Руси с Византией','Первый сохранившийся письменный договор Руси с Византией, заключённый после успешного похода Олега на Константинополь.'],
['rus','945','','Восстание древлян','Древляне убили князя Игоря за повторный сбор дани; княгиня Ольга упорядочила её сбор — установила уроки и погосты.'],
['rus','964–972','','Походы Святослава','Князь Святослав разгромил Хазарию и Волжскую Булгарию, воевал с Византией за Подунавье.'],
['rus','988','','Крещение Руси','Князь Владимир принял христианство как государственную религию; Русь вошла в круг европейских христианских государств.'],
['rus','1019–1054','','Правление Ярослава Мудрого','Расцвет Киева: первый письменный свод законов «Русская Правда», Софийские соборы в Киеве и Новгороде, династические браки с королевскими домами Европы.'],
['rus','1097','','Любечский съезд','Князья договорились «каждо да держит отчину свою» — закрепили наследственные владения, пытаясь прекратить усобицы.'],
['rus','1113','','Восстание в Киеве','После восстания против ростовщиков великим князем призван Владимир Мономах; его Устав ограничил проценты по долгам.'],
['rus','1147','','Первое упоминание Москвы','Москва впервые названа в летописи — в приглашении Юрия Долгорукого на встречу князю Святославу Ольговичу.'],
['rus','1169','','Взятие Киева Андреем Боголюбским','Владимиро-суздальский князь разграбил Киев, но не перенёс туда столицу — центром Руси постепенно стал Владимир.'],
['rus','1185','','Поход князя Игоря на половцев','Неудачный поход новгород-северского князя Игоря Святославича; ему посвящена «Словом о полку Игореве».'],
['rus','1206','','Держава Чингисхана','На курултае Темучин провозглашён Чингисханом — великим ханом объединённых монгольских племён.'],
['rus','1223','','Битва на Калке','Первое столкновение русских с монголами: объединённое русско-половецкое войско потерпело тяжёлое поражение.'],
['rus','1237–1238','','Первое нашествие Батыя','Монголы разорили Рязань, Владимир и другие города Северо-Восточной Руси; Козельск прозван «злым городом».'],
['rus','1239–1240','','Второе нашествие Батыя','Разорены южные земли; в декабре 1240 года пал Киев, Русь попала под ордынскую зависимость.'],

/* ---------- ОРДЫНСКОЕ ВРЕМЯ И ВОЗВЫШЕНИЕ МОСКВЫ ---------- */
['ord','1240','','Невская битва','Князь Александр Ярославич разбил шведский отряд в устье Ижоры; за победу получил прозвание Невский.'],

function defaultProg(){ return { v:1, meta:{answers:0, correct:0, sessions:0, updated:Date.now(), resetAt:0}, items:{} }; }
function fixProg(p){
  if(!p || typeof p!=='object' || !p.items || typeof p.items!=='object') return defaultProg();
  p.meta = Object.assign({answers:0,correct:0,sessions:0,updated:Date.now(),resetAt:0}, p.meta||{});
  return p;
}
function loadProg(){
  const s = lsGet(progKey());
  if(!s) return defaultProg();
  try{ return fixProg(JSON.parse(s)); }catch(e){ return defaultProg(); }
}
/* Слияние двух копий прогресса (это устройство + сервер): по каждой дате берём более свежую запись.
   Записи старше последнего сброса прогресса отбрасываются. Та же логика — в скрипте Google Таблицы. */
function mergeProg(a, b){
  a = fixProg(a); b = fixProg(b);
  const ra = +a.meta.resetAt||0, rb = +b.meta.resetAt||0, resetAt = Math.max(ra, rb);
  const out = { v:1, meta:{answers:0, correct:0, sessions:0, updated:0, resetAt:resetAt}, items:{} };
  [a,b].forEach(p=>{
    Object.keys(p.items).forEach(id=>{
      const it = p.items[id];
      if(!it || typeof it!=='object') return;
      const ts = +it.ts||0;
      if(ts < resetAt) return;
      if(!out.items[id] || (+out.items[id].ts||0) < ts) out.items[id] = it;
    });
  });
  (ra===rb ? [a,b] : [ra>rb ? a : b]).forEach(p=>{
    ['answers','correct','sessions','updated'].forEach(k=>{ out.meta[k] = Math.max(out.meta[k], +p.meta[k]||0); });
  });
  return out;
}

if(CLOUD) user = loadUser();
let prog = loadProg();
let dirty = CLOUD && !!user && lsGet(dirtyKey())==='1';   // есть ответы, ещё не отправленные на сервер
let rev = 0;                                              // счётчик локальных изменений
function setDirty(v){ dirty = v; if(user){ if(v) lsSet(dirtyKey(),'1'); else lsDel(dirtyKey()); } }
function storeLocal(){ lsSet(progKey(), JSON.stringify(prog)); }
function saveProg(){
  prog.meta.updated = Date.now();
  storeLocal();
  if(CLOUD && user){ rev++; setDirty(true); schedulePush(); }
}

/* ---------- синхронизация с сервером ---------- */
const sync = { state:'idle', pushing:false, timer:null, lastPull:0, flushedRev:-1 };
const SYNC_TEXT = { idle:'', pending:'сохраняю…', saving:'сохраняю…', ok:'✓ сохранено', offline:'⚠ нет связи' };
const SYNC_TITLE = { offline:'Ответы сохранены на этом устройстве и отправятся на сервер, когда появится связь' };
function setSync(state){
  sync.state = state;
  document.querySelectorAll('.js-sync').forEach(el=>{
    el.textContent = SYNC_TEXT[state]||'';
    el.title = SYNC_TITLE[state]||'';
    el.classList.toggle('bad', state==='offline');
  });
}
function apiCall(payload, opts){
  const ctrl = (typeof AbortController!=='undefined') ? new AbortController() : null;
  const timer = setTimeout(()=>{ if(ctrl) ctrl.abort(); }, 25000);
  const o = { redirect:'follow' };
  if(ctrl) o.signal = ctrl.signal;
  let url = API;
  if(payload.action==='save'){
    /* Тело — обычная строка: браузер шлёт её как text/plain, без предварительного CORS-запроса. */
    o.method = 'POST'; o.body = JSON.stringify(payload);
    if(opts && opts.keepalive) o.keepalive = true;
  } else {
    const q = Object.keys(payload).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(payload[k])).join('&');
    url += (url.indexOf('?')>-1 ? '&' : '?') + q + '&_=' + Date.now();
  }
  return fetch(url, o)
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(r=>{ clearTimeout(timer); return r; }, e=>{ clearTimeout(timer); throw e; });
}
/* Отправка прогресса. Возвращает 'ok' | 'gone' (код удалён преподавателем) | 'fail'. */
function sendSave(opts){
  const u = user, myRev = rev;
  if(!CLOUD || !u) return Promise.resolve('fail');
  return apiCall({action:'save', code:u.code, progress:prog, total:DATA.length}, opts).then(r=>{
    if(r && r.ok){
      if(user && user.code===u.code && rev===myRev) setDirty(false);
      return 'ok';
    }
    return (r && r.error==='not_found') ? 'gone' : 'fail';
  }).catch(()=> 'fail');
}
function schedulePush(delay){
  if(!CLOUD || !user) return;
  clearTimeout(sync.timer);
  sync.timer = setTimeout(pushNow, delay==null ? 2500 : delay);
  if(sync.state!=='saving') setSync('pending');
}
function pushNow(){
  clearTimeout(sync.timer); sync.timer = null;
  if(!CLOUD || !user) return Promise.resolve();
  if(sync.pushing){ schedulePush(1500); return Promise.resolve(); }
  sync.pushing = true; setSync('saving');
  const u = user;
  return sendSave().then(res=>{
    sync.pushing = false;
    if(!user || user.code!==u.code) return;
    if(res==='gone'){ forceLogout('Этот код больше не действует. Обратитесь к преподавателю.'); return; }
    if(res==='fail'){ setSync('offline'); return; }
    if(dirty) schedulePush(1000); else setSync('ok');
  });
}
/* Загрузка прогресса с сервера и слияние с тем, что есть на устройстве. */
function pull(manual){
  if(!CLOUD || !user) return Promise.resolve();
  const u = user;
  sync.lastPull = Date.now();
  if(manual) setSync('saving');
  return apiCall({action:'load', code:u.code}).then(r=>{
    if(!user || user.code!==u.code) return;
    if(r && r.ok){
      if(typeof r.name==='string' && r.name!==user.name){ user.name = r.name; lsSet(USER_KEY, JSON.stringify(user)); }
      if(r.progress){ prog = mergeProg(prog, r.progress); storeLocal(); }
      if(dirty) schedulePush(0); else setSync('ok');
      if(!sessionActive()) render();
      if(manual) toast('Прогресс синхронизирован');
    } else if(r && r.error==='not_found'){
      forceLogout('Этот код больше не действует. Обратитесь к преподавателю.');
    } else {
      setSync('offline');
      if(manual) toast('Сервер не ответил. Попробуйте позже');
    }
  }).catch(()=>{
    setSync('offline');
    if(manual) toast('Нет связи с сервером. Прогресс сохранён на этом устройстве');
  });
}
/* Страницу сворачивают или закрывают — отправляем несохранённое, не дожидаясь таймера. */
function flushOnHide(){
  if(!CLOUD || !user || !dirty || sync.flushedRev===rev) return;
  sync.flushedRev = rev;
  sendSave({keepalive:true}).then(res=>{ if(res==='ok' && !dirty) setSync('ok'); else if(res!=='ok') sync.flushedRev = -1; });
}

/* ---------- вход по коду ---------- */
const login = { busy:false, msg:'' };
function doLogin(){
  if(login.busy) return;
  const inp = $('#codeInput');
  const code = normCode(inp ? inp.value : '');
  if(!code){ login.msg = 'Введите код, который выдал преподаватель'; render(); return; }
  login.busy = true; login.msg = ''; login.val = code; render();
  apiCall({action:'load', code:code}).then(r=>{
    login.busy = false;
    if(r && r.ok){
      user = { code:code, name:String(r.name||'') };
      lsSet(USER_KEY, JSON.stringify(user));
      dirty = lsGet(dirtyKey())==='1';
      prog = loadProg();                                   // то, что могло остаться на этом устройстве
      if(r.progress) prog = mergeProg(prog, r.progress);
      storeLocal();
      sync.lastPull = Date.now();
      login.val = ''; S.screen = 'home'; S.session = null;
      render();
      if(dirty) schedulePush(0); else setSync('ok');
      toast(user.name ? 'Здравствуйте, '+user.name+'!' : 'Вход выполнен');
    } else {
      login.msg = (r && r.error==='not_found')
        ? 'Код не найден. Проверьте, нет ли опечатки, или обратитесь к преподавателю.'
        : 'Сервер ответил ошибкой. Попробуйте ещё раз через минуту.';
      render();
    }
  }).catch(()=>{
    login.busy = false;
    login.msg = 'Нет связи с сервером. Проверьте интернет и попробуйте ещё раз.';
    render();
  });
}
function clearUser(msg){
  clearTimeout(sync.timer); sync.timer = null;
  user = null; dirty = false; lsDel(USER_KEY);
  prog = defaultProg(); S.screen = 'home'; S.session = null;
  login.msg = msg||''; login.busy = false;
  setSync('idle'); render(); window.scrollTo(0,0);
}
function forceLogout(msg){ clearUser(msg); }
function logout(){
  if(!user) return;
  if(!dirty){ clearUser(''); return; }
  setSync('saving');
  sendSave().then(res=>{
    clearUser(res==='ok' ? '' : 'Не удалось связаться с сервером: последние ответы остались на этом устройстве и отправятся при следующем входе с тем же кодом.');
  });
}
const sessionActive = () => S.screen==='session' && S.session && !S.session.done;

const lvlOf = d => (prog.items[d.id] && prog.items[d.id].lvl) || 0;
function mark(id, ok){
  const it = prog.items[id] || {lvl:0, ok:0, seen:0};
  it.seen++;
  if(ok){ it.ok++; it.lvl = Math.min(5, it.lvl+1); } else { it.lvl = 0; }
  it.ts = Date.now();
  prog.items[id] = it;
  prog.meta.answers++;
  if(ok) prog.meta.correct++;
  saveProg();
}
const STATUS = d => { const l = lvlOf(d); return l>=3 ? 'done' : l>=1 ? 'learn' : 'new'; };
const statusChip = d => {
  const s = STATUS(d);
  if(s==='done') return '<span class="chip chip-done">выучена</span>';
  if(s==='learn') return '<span class="chip chip-learn">учится</span>';
  return '<span class="chip chip-new">не изучена</span>';
};

/* ---------- состояние ---------- */
const S = { screen:'home', scope:'all', mode:'cards', onlyNew:false, session:null,
            filter:{period:'all', hide:false} };

/* ---------- сборка сессии ---------- */
function startSession(scope, mode){
  let pool = scope==='all' ? DATA.slice() : DATA.filter(d=>d.p===scope);
  if(!pool.length) return;
  if(S.onlyNew){
    const un = pool.filter(d=>lvlOf(d)<3);
    if(un.length) pool = un;
    else toast('Невыученных дат здесь нет — тренируем весь раздел');
  }
  const q = shuffle(pool.slice());
  q.sort((a,b)=>lvlOf(a)-lvlOf(b));
  const n = mode==='cards' ? 20 : 10;
  S.screen='session'; S.scope=scope; S.mode=mode;
  S.session = { mode, scope, queue:q.slice(0,Math.min(n,q.length)), i:0, right:0, wrong:[],
                flipped:false, answered:false, sel:null, q:null, val:'', done:false };
  render();
  window.scrollTo(0,0);
}
const isYearUnique = e => DATA.filter(x=>x.y===e.y).length===1;

function buildQuestion(){
  const e = S.session.queue[S.session.i];
  const wantYearQ = Math.random()<0.5 && isYearUnique(e);
  if(wantYearQ){
    const cands = DATA.filter(d=>d.id!==e.id && d.y!==e.y);
    const same = cands.filter(d=>d.p===e.p);
    const opts = shuffle([e, ...pickN(same.length>=3?same:cands, 3)]);
    return { type:'ey', e, opts, ci: opts.indexOf(e) };
  }
  const cands = DATA.filter(d=>d.id!==e.id && d.y!==e.y);
  const same = cands.filter(d=>d.p===e.p);
  const opts = shuffle([e, ...pickN(same.length>=3?same:cands, 3)]);
  return { type:'ye', e, opts, ci: opts.indexOf(e) };
}

function allowedAnswers(e){
  const set = new Set([norm(e.y)]);
  const base = norm(e.y);
  if(base.indexOf('-')>-1){ const parts = base.split('-'); set.add(parts[0]); set.add(parts[1]); }
  return set;
}

/* ---------- ответы ---------- */
function answerQuiz(i){
  const s = S.session;
  if(!s || s.done || s.answered) return;
  s.sel = i;
  const ok = i===s.q.ci;
  mark(s.q.e.id, ok);
  if(ok) s.right++; else s.wrong.push(s.q.e);
  s.answered = true;
  render();
}
function checkTyped(){
  const s = S.session;
  if(!s || s.done || s.answered) return;
  const inp = $('#typeInput');
  s.val = inp ? inp.value : '';
  if(!norm(s.val)) return;
  const e = s.q.e;
  const ok = allowedAnswers(e).has(norm(s.val));
  mark(e.id, ok);
  if(ok) s.right++; else s.wrong.push(e);
  s.answered = true;
  render();
}
function nextQ(){
  const s = S.session;
  if(!s || s.done) return;
  s.i++;
  s.answered=false; s.sel=null; s.q=null; s.val=''; s.flipped=false;
  if(s.i >= s.queue.length) finishSession();
  else { if(s.mode==='quiz') s.q = buildQuestion(); render(); }
}
function flipCard(){
  const s = S.session;
  if(s && s.mode==='cards' && !s.done){ s.flipped = !s.flipped; render(); }
}
function rateCard(ok){
  const s = S.session;
  if(!s || s.mode!=='cards' || s.done) return;
  const e = s.queue[s.i];
  mark(e.id, ok);
  if(ok) s.right++; else s.wrong.push(e);
  s.i++; s.flipped=false;
  if(s.i >= s.queue.length) finishSession(); else render();
}
function finishSession(){
  const s = S.session;
  s.done = true;
  prog.meta.sessions++;
  saveProg();
  render();
}
function repeatMistakes(){
  const s = S.session;
  const uniq = []; const seen = {};
  s.wrong.forEach(e=>{ if(!seen[e.id]){ seen[e.id]=1; uniq.push(e); } });
  if(!uniq.length){ toast('Ошибок не было'); return; }
  S.session = { mode:s.mode, scope:s.scope, queue:uniq, i:0, right:0, wrong:[],
                flipped:false, answered:false, sel:null, q:null, val:'', done:false };
  render();
  window.scrollTo(0,0);
}
function exitSession(){ S.screen='home'; S.session=null; render(); }

/* ---------- рендер: каркас ---------- */
function render(){
  const app = $('#app');
  const needLogin = CLOUD && !user;
  document.body.classList.toggle('logged-out', needLogin);
  document.body.classList.toggle('logged-in', CLOUD && !!user);
  const ub = $('#userBox');
  if(ub){
    ub.hidden = !(CLOUD && user);
    if(CLOUD && user){
      ub.innerHTML = '<span class="user-name">👤 '+esc(user.name||user.code)+'</span>'
        + '<span class="js-sync sync-st"></span>'
        + '<button class="nav-btn tiny-btn" data-act="logout">Выйти</button>';
    } else ub.innerHTML = '';
  }
  if(needLogin){
    app.innerHTML = loginHTML();
    const ci = $('#codeInput'); if(ci && !login.busy) ci.focus();
    return;
  }
  if(S.screen==='home') app.innerHTML = homeHTML();
  else if(S.screen==='session') app.innerHTML = sessionHTML();
  else app.innerHTML = progressHTML();
  const nav = $('#navHome'), navP = $('#navProgress');
  if(nav) nav.classList.toggle('active', S.screen!=='progress');
  if(navP) navP.classList.toggle('active', S.screen==='progress');
  if(S.screen==='session' && S.session && S.session.mode==='type' && !S.session.done && !S.session.answered){
    const inp = $('#typeInput'); if(inp) inp.focus();
  }
  if(CLOUD) setSync(sync.state);
}

/* ---------- рендер: главная ---------- */
function statCounts(list){
  let done=0, learn=0;
  list.forEach(d=>{ const l=lvlOf(d); if(l>=3) done++; else if(l>=1) learn++; });
  return { done, learn, fresh: list.length-done-learn, total:list.length };
}
function ringSVG(pct, size){
  size = size||72; const st = 8, r=(size-st)/2, c=2*Math.PI*r, off=c*(1-Math.min(100,Math.max(0,pct))/100);
  return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
    + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="'+st+'"/>'
    + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--gold)" stroke-width="'+st+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>'
    + '<text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle" font-size="'+Math.round(size*0.24)+'" font-weight="700" fill="var(--ink)">'+Math.round(pct)+'%</text></svg>';
}

    + '<button class="'+cls+'" data-act="start" data-scope="'+scope+'" data-mode="cards">🃏 Карточки</button>'

    + '<button class="'+cls+'" data-act="start" data-scope="'+scope+'" data-mode="type">✎ Ввод года</button>'

    + '<div class="rate-row">'
    + '<button class="btn red" data-act="rate" data-ok="0">Ещё учить (1)</button>'
    + '<button class="btn green" data-act="rate" data-ok="1">Знаю (2)</button>'
    + '</div>'
    + '<div class="hint muted small">Пробел или клик по карточке — перевернуть · 1 — ещё учить · 2 — знаю</div>';
}
const OPT_LETTERS = ['А','Б','В','Г'];
function qHTML(){
  const s = S.session, q = s.q, e = q.e;
  let h = sessionTop();
  if(q.type==='ey'){
    h += '<div class="q-box"><div class="q-label muted">Что произошло в этот год?</div>'
       + '<div class="q-year serif">'+esc(yearLabel(e))+'</div></div>';
  } else {
    h += '<div class="q-box"><div class="q-label muted">Когда произошло событие?</div>'
       + '<div class="q-title serif">'+esc(e.t)+'</div>'
       + '<div class="muted small">'+esc(P(e).name)+'</div></div>';
  }
  h += '<div class="opts">';
  q.opts.forEach((o,i)=>{
    let cls = 'opt';
    if(s.answered){
      if(i===q.ci) cls += ' correct';
      else if(i===s.sel) cls += ' wrong';
      else cls += ' dim';
    }
    h += '<button class="'+cls+'" data-act="opt" data-i="'+i+'">'
       + '<span class="opt-letter">'+OPT_LETTERS[i]+'</span>'
       + '<span>'+(q.type==='ey' ? esc(o.t) : esc(yearLabel(o)))+'</span></button>';
  });
  h += '</div>';
  if(s.answered){
    const ok = s.sel===q.ci;
    h += '<div class="fb '+(ok?'ok':'bad')+'"><b>'+(ok?'✓ Верно!':'✗ Ошибка')+'</b> — '
       + esc(yearLabel(e)) + ' · ' + esc(e.t) + '.<div class="fb-desc">'+esc(e.d)+'</div></div>'
       + '<div class="center"><button class="btn" data-act="next">Далее (Enter)</button></div>';
  }
  return h;
}
function typeHTML(){
  const s = S.session, e = s.q.e;
  let h = sessionTop()
    + '<div class="q-box"><div class="q-label muted">Впишите год события</div>'
    + '<div class="q-title serif">'+esc(e.t)+'</div>'
    + '<div class="muted small">'+esc(P(e).name)+'</div></div>';
  if(!s.answered){
    h += '<div class="type-row">'
       + '<input id="typeInput" class="type-input" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="Например, 1380" value="'+esc(s.val)+'">'
       + '<button class="btn" data-act="check">Ответить</button></div>'
       + '<div class="hint muted small">Enter — ответить. Допускаются и даты-периоды: можно ввести один из граничных годов или диапазон.</div>';
  } else {
    const ok = allowedAnswers(e).has(norm(s.val));
    h += '<div class="fb '+(ok?'ok':'bad')+'"><b>'+(ok?'✓ Верно!':'✗ Ошибка')+'</b> Правильный ответ: <b>'+esc(yearLabel(e))+'</b>.'
       + '<div class="fb-desc">'+esc(e.t)+'. '+esc(e.d)+'</div></div>'
       + '<div class="center"><button class="btn" data-act="next">Далее (Enter)</button></div>';
  }
  return h;
}
function doneHTML(){
  const s = S.session;
  const total = s.queue.length;
  const pct = total ? Math.round(s.right/total*100) : 0;
  let verdict;
  if(pct>=90) verdict = 'Отлично! Даты почти не требуют повторения.';
  else if(pct>=70) verdict = 'Хорошо! Осталось закрепить сложные места.';
  else verdict = 'Есть над чем поработать — повторите ошибки.';
  const uniq = []; const seen = {};
  s.wrong.forEach(e=>{ if(!seen[e.id]){ seen[e.id]=1; uniq.push(e); } });
  let h = sessionTop()
    + '<div class="done-box card">'
    + '<h2>Сессия завершена</h2>'
    + '<div class="done-flex">'+ringSVG(pct, 96)
    + '<div><div class="done-line">Верных ответов: <b>'+s.right+' из '+total+'</b></div>'
    + '<div class="muted small">'+verdict+'</div></div></div>';
  if(uniq.length){
    h += '<h3 class="mini-title">Повторите эти даты</h3><ul class="miss-list">';
    uniq.forEach(e=>{ h += '<li><b>'+esc(yearLabel(e))+'</b> — '+esc(e.t)+'<div class="muted small">'+esc(e.d)+'</div></li>'; });
    h += '</ul>';
  }
  h += '<div class="mode-row center">'
     + (uniq.length ? '<button class="btn" data-act="repeat">Повторить ошибки ('+uniq.length+')</button>' : '')
     + '<button class="btn ghost" data-act="again">Ещё сессия</button>'
     + '<button class="btn ghost" data-act="exit">На главную</button></div></div>';
  return h;
}
function sessionHTML(){
  const s = S.session;
  if(!s) return homeHTML();
  if(s.done) return doneHTML();
  if(s.mode==='cards') return cardHTML();
  if(!s.q) s.q = buildQuestion();
  return s.mode==='quiz' ? qHTML() : typeHTML();
}

/* ---------- рендер: прогресс ---------- */
function progressHTML(){
  const all = statCounts(DATA);
  const pct = Math.round(all.done/all.total*100);
  let code = '';
  try{ code = btoa(unescape(encodeURIComponent(JSON.stringify(prog)))); }catch(e){ code = '(недоступно в этом окне)'; }

  let h = '<section class="card">'
    + '<h2>Мой прогресс</h2>'
    + '<div class="done-flex"><div class="hero-ring">'+ringSVG(pct,96)+'</div>'
    + '<div class="stat-lines">'
    + '<div>Выучено: <b>'+all.done+'</b> из '+all.total+' '+plural(all.total,['даты','дат','дат'])+'</div>'
    + '<div>В процессе: <b>'+all.learn+'</b></div>'
    + '<div>Не начато: <b>'+all.fresh+'</b></div>'
    + '<div>Сессий: <b>'+prog.meta.sessions+'</b> · ответов: <b>'+prog.meta.answers+'</b> · точность: <b>'+(prog.meta.answers?Math.round(prog.meta.correct/prog.meta.answers*100):0)+'%</b></div>'
    + '</div></div></section>';

  if(CLOUD){
    h += '<section class="card"><h3>Синхронизация</h3>'
      + '<p class="muted small lead">Ученик: <b>'+esc(user.name||user.code)+'</b>. Прогресс сохраняется на сервере автоматически: войдите с тем же кодом на любом телефоне или компьютере — и продолжите с того же места.</p>'
      + '<button class="btn tiny" data-act="syncnow">Синхронизировать сейчас</button> <span class="js-sync sync-st dark small"></span>'
      + '</section>';
  } else {
    h += '<section class="card"><h3>Перенос прогресса</h3>'
      + '<p class="muted small">Прогресс хранится в этом браузере. Чтобы перенести его на другой компьютер (или сделать резервную копию), скопируйте код и вставьте его там же в поле ниже.</p>'
      + '<textarea id="expCode" class="code" readonly rows="3">'+esc(code)+'</textarea>'
      + '<button class="btn tiny" data-act="copycode">Скопировать код</button>'
      + '<div class="gap"></div>'
      + '<textarea id="impCode" class="code" rows="3" placeholder="Вставьте сюда код прогресса и нажмите «Загрузить»"></textarea>'
      + '<button class="btn tiny" data-act="import">Загрузить из кода</button> <span id="impMsg" class="small"></span>'
      + '</section>';
  }

  h += '<section class="card"><h3>Все даты</h3>'
    + '<div class="filter-row">'
    + '<select data-act="fperiod">'
    + '<option value="all"'+(S.filter.period==='all'?' selected':'')+'>Все разделы</option>';
  Object.keys(PERIODS).forEach(p=>{
    h += '<option value="'+p+'"'+(S.filter.period===p?' selected':'')+'>'+esc(PERIODS[p].name)+'</option>';
  });
  h += '</select>'
    + '<label class="toggle"><input type="checkbox" data-act="fhide"'+(S.filter.hide?' checked':'')+'><span>Скрыть выученные</span></label>'
    + '</div><div class="table-wrap"><table class="dates">';
  const pids = S.filter.period==='all' ? Object.keys(PERIODS) : [S.filter.period];
  pids.forEach(p=>{
    const list = DATA.filter(d=>d.p===p);
    const st = statCounts(list);
    if(S.filter.hide && st.done===st.total) return;
    h += '<tr class="group"><td colspan="3">'+PERIODS[p].icon+' <b>'+esc(PERIODS[p].name)+'</b> <span class="muted small">('+PERIODS[p].years+') — выучено '+st.done+' из '+st.total+'</span></td></tr>';
    list.forEach(d=>{
      if(S.filter.hide && STATUS(d)==='done') return;
      h += '<tr><td class="yr serif"><b>'+esc(d.y)+'</b>'+(d.m?'<div class="muted tiny">'+esc(d.m)+'</div>':'')+'</td>'
        + '<td>'+esc(d.t)+'<div class="muted small">'+esc(d.d)+'</div></td>'
        + '<td class="st">'+statusChip(d)+'</td></tr>';
    });
  });
  h += '</table></div></section>';

  h += '<section class="card danger-zone"><h3>Опасная зона</h3>'
    + '<button class="btn red" data-act="reset">Сбросить весь прогресс</button>'
    + '<p class="muted small">Все отметки «выучено» будут удалены'+(CLOUD?' на всех устройствах':'')+'. Действие необратимо.</p></section>';
  return h;
}

/* ---------- события ---------- */
document.addEventListener('click', ev=>{
  const el = ev.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  if(act==='home'||act==='exit'){ if(act==='exit') exitSession(); else { S.screen='home'; render(); } }
  else if(act==='progress'){ S.screen='progress'; render(); window.scrollTo(0,0); }
  else if(act==='start'){ startSession(el.dataset.scope, el.dataset.mode); }
  else if(act==='flip'){ flipCard(); }
  else if(act==='rate'){ rateCard(el.dataset.ok==='1'); }
  else if(act==='opt'){ answerQuiz(+el.dataset.i); }
  else if(act==='next'){ nextQ(); }
  else if(act==='check'){ checkTyped(); }
  else if(act==='repeat'){ repeatMistakes(); }
  else if(act==='again'){ startSession(S.scope, S.mode); }
  else if(act==='copycode'){
    const ta = $('#expCode');
    if(ta){ ta.focus(); ta.select();
      try{ document.execCommand('copy'); toast('Код скопирован'); }
      catch(e){ toast('Скопируйте текст вручную (Ctrl+C)'); }
    }
  }
  else if(act==='import'){
    const msg = $('#impMsg');
    const res = importCode(($('#impCode')||{}).value||'');
    if(msg) msg.textContent = res;
    if(res==='Прогресс загружен!') toast(res);
  }
  else if(act==='login'){ doLogin(); }
  else if(act==='logout'){ logout(); }
  else if(act==='syncnow'){ if(dirty) pushNow().then(()=>pull(true)); else pull(true); }
  else if(act==='reset'){ $('#modalBack').hidden = false; }
  else if(act==='modal-no'){ $('#modalBack').hidden = true; }
  else if(act==='modal-yes'){
    prog = defaultProg(); prog.meta.resetAt = Date.now(); saveProg();
    $('#modalBack').hidden = true; S.screen='home'; render(); toast('Прогресс сброшен');
  }
});
document.addEventListener('change', ev=>{
  const el = ev.target.closest('[data-act]');
  if(!el) return;
  if(el.dataset.act==='onlynew') S.onlyNew = el.checked;
  else if(el.dataset.act==='fperiod'){ S.filter.period = el.value; render(); }
  else if(el.dataset.act==='fhide'){ S.filter.hide = el.checked; render(); }
});
document.addEventListener('keydown', ev=>{
  if(CLOUD && !user){
    if(ev.code==='Enter' || ev.key==='Enter'){ ev.preventDefault(); doLogin(); }
    return;
  }
  const s = S.session;
  if(S.screen==='session' && s && !s.done){
    if(s.mode==='cards'){
      if(ev.code==='Space'||ev.code==='Enter'){ ev.preventDefault(); flipCard(); return; }
      if(ev.key==='1'){ rateCard(false); return; }
      if(ev.key==='2'){ rateCard(true); return; }
    } else {
      if(s.answered){
        if(ev.code==='Enter'||ev.code==='Space'){ ev.preventDefault(); nextQ(); return; }
      } else if(s.mode==='quiz'){
        const i = ['1','2','3','4'].indexOf(ev.key);
        if(i>-1 && i<s.q.opts.length){ answerQuiz(i); return; }
      } else if(s.mode==='type'){
        if(ev.code==='Enter'){ ev.preventDefault(); checkTyped(); return; }
      }
    }
  }
  if(S.screen==='progress' && ev.code==='Enter' && ev.target && ev.target.id==='impCode'){
    const msg = $('#impMsg'); const res = importCode(ev.target.value||'');
    if(msg) msg.textContent = res;
  }
});

function importCode(txt){
  txt = (txt||'').trim();
  if(!txt) return 'Поле пустое';
  let obj = null;
  if(txt[0]==='{'){ try{ obj = JSON.parse(txt); }catch(e){} }
  if(!obj){
    try{ obj = JSON.parse(decodeURIComponent(escape(atob(txt)))); }catch(e){}
  }
  if(!obj || typeof obj!=='object' || !obj.items) return 'Не удалось прочитать код';
  prog = { v:1, meta:Object.assign({answers:0,correct:0,sessions:0,updated:Date.now()},obj.meta||{}), items:obj.items };
  saveProg(); render();
  return 'Прогресс загружен!';
}

let toastTimer = null;
function toast(text){
  let t = $('#toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent = text; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ---------- запуск ---------- */
render();
if(CLOUD){
  if(user) pull();
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='hidden'){ flushOnHide(); return; }
    if(!user) return;
    if(dirty) schedulePush(0);
    if(!sessionActive() && Date.now()-sync.lastPull > 60000) pull();
  });
  window.addEventListener('pagehide', flushOnHide);
  window.addEventListener('online', ()=>{ if(user && dirty) schedulePush(0); });
}

</script>
